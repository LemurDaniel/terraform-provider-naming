# Global default index offset, so indices start at 01 instead of 00.
index_modifier: 1

abbreviations:
  Azure:
    Microsoft.Storage/storageAccounts::default: mystg
    Microsoft.KeyVault/vaults::default: mykv
    Microsoft.CustomProvider/customResource::default: cust

# Every table is merged per key with your value winning, so a single entry
# can be overridden without restating the block around it. The entries below
# are spelled out only to show the shape.
patterns:
  default: "<TYPE>-<LOCATION>-<ENVIRONMENT>-<NAME><?PURPOSE;-%s>-<INDEX;%02s>"

  Azure:
    default: "<TYPE>-<LOCATION>-<ENVIRONMENT>-<NAME><?PURPOSE;-%s>-<INDEX;%02s>"

    Microsoft.Storage/storageAccounts:
      default: "<TYPE><LOCATION><ENVIRONMENT><NAME><?PURPOSE><UNIQUE_ID_3>"

    Microsoft.KeyVault/vaults:
      default: "<TYPE>-<ENVIRONMENT>-<NAME><?PURPOSE;-%s>-<UNIQUE_ID_3>"

    Microsoft.Network/virtualNetworks:
      default: "<TYPE>-<LOCATION>-<ENVIRONMENT>-<NAME><?PURPOSE;-%s>-<INDEX;%02s>"

# Case-insensitive lookup tables consumers can use to shorten parameter
# values before feeding them into a pattern.
mappings:
  location:
    westeurope: we
    West Europe: we
    germanywestcentral: gwc
    Germany West Central: gwc

  environment:
    development: dev
    staging: stg
    production: prod
