  Microsoft.Maintenance/maintenanceConfigurations:
    microsoft: maintenance_configuration
  Microsoft.Web/hostingEnvironments:
    microsoft: app_service_environment
  Microsoft.Web/serverFarms:
    microsoft: app_service_plan
  Microsoft.Web/sites:
    microsoft: app_service
    regex: "^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$"
    reason: "resourceDefinition.json is unanchored at the end and allows only lower case at the edges; Azure: 2-60, alphanumerics and hyphens, not starting or ending with a hyphen."
  Microsoft.Web/sites::function:
    microsoft: function_app
  Microsoft.Web/staticSites:
    microsoft: static_web_app
  Microsoft.Compute/availabilitySets:
    microsoft: availability_set
  Microsoft.Compute/diskEncryptionSets:
    microsoft: disk_encryption_set
    regex: "^[a-zA-Z0-9_-]+$"
    reason: "resourceDefinition.json allows only alphanumerics and underscores. Azure: 1-80, alphanumerics, underscores and hyphens."
  Microsoft.Compute/galleries:
    microsoft: shared_image_gallery
  Microsoft.Compute/disks:
    microsoft: managed_disk
    regex: "^[a-zA-Z0-9_-]+$"
    reason: "resourceDefinition.json allows only alphanumerics and underscores. Azure: 1-80, alphanumerics, underscores and hyphens."
  Microsoft.Compute/restorePointCollections:
    microsoft: virtual_machine_restore_point_collection
  Microsoft.Compute/snapshots:
    microsoft: snapshots
  # The 15 characters of virtual_machine are the Windows computer name, not the resource name:
  # Azure allows 64 for the VM itself. A Windows VM is the `windows` kind.
  Microsoft.Compute/virtualMachines:
    microsoft: linux_virtual_machine
  Microsoft.Compute/virtualMachines::windows:
    microsoft: windows_virtual_machine
  Microsoft.Compute/virtualMachineScaleSets:
    microsoft: linux_virtual_machine_scale_set
  Microsoft.Compute/virtualMachineScaleSets::windows:
    microsoft: windows_virtual_machine_scale_set
  Microsoft.Compute/sshPublicKeys:
    microsoft: ssh_public_key

