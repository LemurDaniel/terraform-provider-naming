#
# ################################################################################################
# ## The naming rules every rendered name is checked against.
#
# Keyed like the abbreviations: <provider> -> "<Namespace>/<Type>[::<kind>]". A rule resolves
# <type>::<naming_id> -> <type>::<kind> -> <type>; a type without a rule is not checked.
#
#   microsoft:   the entry in Microsoft's resourceDefinition.json (Azure/naming/azurerm, vendored
#                under microsoft/) the limits are taken from.
#   min_length, max_length, regex, scope:
#                set explicitly, each wins over the referenced entry. A correction carries
#                `reason` with the Azure documentation it follows:
#                https://learn.microsoft.com/azure/azure-resource-manager/management/resource-name-rules
#
# A convention or a naming file may carry a `rules:` block of the same shape; it is merged over
# this one per key, the caller's value winning.

Azure:

  # ----- AI + Machine Learning -------------------------------------------
  Microsoft.CognitiveServices/accounts:
    microsoft: cognitive_account
    regex: "^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$"
    reason: "resourceDefinition.json gives 2-64 but a 260-character lookahead, and allows a trailing hyphen. Azure: 2-64, alphanumerics and hyphens, starting and ending with an alphanumeric."
  Microsoft.MachineLearningServices/workspaces:
    microsoft: machine_learning_workspace
  Microsoft.BotService/botServices:
    microsoft: bot_web_app
  Microsoft.Search/searchServices:
    microsoft: search_service

  # ----- Analytics -------------------------------------------------------
  Microsoft.Fabric/capacities:
    microsoft: fabric_capacity
  Microsoft.AnalysisServices/servers:
    microsoft: analysis_services_server
  Microsoft.DataFactory/factories:
    microsoft: data_factory
  Microsoft.DataLakeStore/accounts:
    microsoft: data_lake_store
    scope: global
    reason: "resourceDefinition.json gives the scope 'parent'. Azure: unique across Azure."
  Microsoft.PowerBIDedicated/capacities:
    microsoft: powerbi_embedded
  Microsoft.Databricks/workspaces/accessConnectors:
    microsoft: databricks_access_connector
  Microsoft.Databricks/workspaces:
    microsoft: databricks_workspace
  Microsoft.Kusto/clusters:
    microsoft: kusto_cluster
  Microsoft.Kusto/clusters/databases:
    microsoft: kusto_database
  Microsoft.Synapse/privateLinkHubs:
    microsoft: synapse_private_link_hub
  Microsoft.Synapse/workspaces/sqlPools:
    microsoft: synapse_sql_pool
  Microsoft.Synapse/workspaces/bigDataPools:
    microsoft: synapse_spark_pool
    min_length: 1
    max_length: 15
    regex: "^[a-zA-Z]([a-zA-Z0-9]*[a-zA-Z0-9])?$"
    reason: "resourceDefinition.json gives 3-32. Azure: 1-15, letters and numbers, starting with a letter."
  Microsoft.Synapse/workspaces:
    microsoft: synapse_workspace

  # ----- Internet of Things ----------------------------------------------
  Microsoft.Devices/IotHubs:
    microsoft: iothub
  Microsoft.Devices/provisioningServices:
    microsoft: iothub_dps
    scope: resourceGroup
    reason: "resourceDefinition.json spells the scope 'resoureceGroup'."
  Microsoft.Devices/provisioningServices/certificates:
    microsoft: iothub_dps_certificate

  # ----- Integration + Messaging -----------------------------------------
  Microsoft.EventHub/namespaces:
    microsoft: eventhub_namespace
    min_length: 6
    reason: "resourceDefinition.json gives 1-50. Azure: 6-50."
  Microsoft.EventHub/namespaces/eventHubs:
